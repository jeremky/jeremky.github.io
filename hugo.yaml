baseURL: https://jeremky.github.io
locale: fr
defaultContentLanguage: fr
title: JeremKy Docs

module:
  imports:
    - path: github.com/imfing/hextra

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1

    - name: A propos
      pageRef: /apropos
      weight: 2

    - name: Search
      weight: 3
      params:
        type: search

    - name: Theme Toggle
      params:
        weight: 4
        type: theme-toggle
        label: false

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

taxonomies:
  tag: tags

params:
  description: "Infos et documentation autour du déploiement d’applications"
  images:
    - "images/opengraph.png"

  externalLinkDecoration: false
  displayUpdatedDate: true

  theme:
    default: system
    displayToggle: false

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      link: /
      width: 40
      height: 20

  page:
    width: wide
    contextMenu:
      enable: false
    tabs:
      sync: true

  toc:
    displayTags: true

  imageZoom:
    enable: true

  contextMenu:
    enable: true

  footer:
    enable: false
    width: wide
    displayCopyright: true
    displayPoweredBy: true
